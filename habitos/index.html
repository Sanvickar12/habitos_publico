<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi hábito</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <h1>Ritual</h1>
      </div>
      <button class="settings-button" id="settingsButton" aria-label="Abrir configuración" title="Configuración">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.6 19a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.09A1.7 1.7 0 0 0 5 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6A1.7 1.7 0 0 0 10.4 3V3h4v.09A1.7 1.7 0 0 0 16 5a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.1.39.3.74.6 1 .3.27.7.41 1.1.4H21v4h-.09A1.7 1.7 0 0 0 19.4 15Z"/></svg>
      </button>
    </header>

    <main>
      <section class="calendar-panel">
        <div class="calendar-heading">
          <div>
            <p class="eyebrow">Mi hábito</p>
            <h2 class="habit-title" id="habitTitle">Beber agua</h2>
          </div>
          <div class="month-nav">
            <button id="prevMonth" aria-label="Mes anterior">←</button>
            <span class="month-label" id="monthLabel"></span>
            <button id="nextMonth" aria-label="Mes siguiente">→</button>
          </div>
        </div>
        <div class="weekdays"><span>Lun</span><span>Mar</span><span>Mié</span><span>Jue</span><span>Vie</span><span>Sáb</span><span>Dom</span></div>
        <div class="calendar-grid" id="calendar"></div>
      </section>

      <aside>
        <section class="side-panel">
          <h2>Hoy</h2>
          <button class="complete-button" id="completeToday">Completado</button>
        </section>
        <section class="side-panel">
          <h2>Este mes</h2>
          <div class="progress-ring" id="progressRing" style="--progress: 0%">
            <div class="progress-ring-inner"><div><strong id="progressPercent">0%</strong><span id="progressCount">0 días</span></div></div>
          </div>
        </section>
        <section class="side-panel settings-panel" id="settingsPanel">
          <h2>Personalizar</h2>
          <label for="nameInput">Nombre del hábito</label>
          <input type="text" id="nameInput" maxlength="32" value="Beber agua">
          <div class="swatches" aria-label="Tema de color">
            <button class="swatch active" data-theme="pink" style="background:#ef8fa3" aria-label="Rosa"></button>
            <button class="swatch" data-theme="yellow" style="background:#e8b94e" aria-label="Amarillo"></button>
            <button class="swatch" data-theme="blue" style="background:#76a9d8" aria-label="Azul"></button>
            <button class="swatch" data-theme="green" style="background:#78b99a" aria-label="Verde"></button>
          </div>
        </section>
      </aside>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
